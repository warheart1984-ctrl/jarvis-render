[tool.poetry]
name = "jarvis"
version = "0.1.0"
description = "Jarvis — conversational FastAPI layer with v0 heuristic emotion and spiral-state trackers"
authors = ["Jon Halstead"]
readme = "README.md"
packages = [{include = "jarvis"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.141.1"
starlette = ">=1.3.1,<2"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
pydantic = "^2.10.0"
pydantic-settings = "^2.14.2"
idna = ">=3.15,<4"
click = ">=8.3.3,<9"
httpx = "^0.28.0"
python-dotenv = "^1.1.0"
PyJWT = {extras = ["crypto"], version = "^2.10.1"}

[tool.poetry.group.dev.dependencies]
ruff = "^0.9.0"
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
