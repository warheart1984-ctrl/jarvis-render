services:
  - type: web
    name: jarvis
    branch: main
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: JARVIS_ENVIRONMENT
        value: production
      - key: JARVIS_LLM_PROVIDER
        value: nvidia
      - key: JARVIS_LLM_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: JARVIS_LLM_FALLBACK_MODELS
        value: openai/gpt-oss-20b,z-ai/glm-5.3-flash
      - key: JARVIS_LLM_ATTEMPT_TIMEOUT_SECONDS
        value: "15"
      - key: NVIDIA_API_KEY
        sync: false
      - key: JARVIS_MEMORY_DB_PATH
        value: /data/jarvis.sqlite3
      - key: JARVIS_CORS_ORIGINS
        sync: false
      - key: JARVIS_SERVICE_TOKEN
        sync: false
    disk:
      name: jarvis-memory
      mountPath: /data
      sizeGB: 1
